apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - db-egress.yaml
images:
  - name: pmservers-auth
    newName: ghcr.io/pretty-manageable-servers/pmservers-auth
    newTag: sha-3df932809178e9ee5aadce6c4899c4706eaf9ad0
patches:
  - target: {kind: Deployment, name: pmservers-auth}
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value: [{name: ghcr-pull}]
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 500m, memory: 256Mi}}
      # The API database is on-prem since 2026-11-23 (pmservers-api k8s/overlays/prod/database.yaml).
      # DATABASE_URL in pms-auth-env is the old Supabase one: this env value wins over envFrom.
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: DATABASE_URL, valueFrom: {secretKeyRef: {name: pms-db-app, key: uri}}}
