<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark light"><title>Sign in to pms</title>
<style>
:root{--bg:#161615;--surface:#1F1E1D;--pill:#2B2A28;--line:#33322F;--strong:#F5F4EF;--text:#E2E0D9;--muted:#9A978F;--accent:#7EA6FF;--code:#E8917A;
--serif:"Source Serif 4",Georgia,"Times New Roman",serif;--sans:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
@media (prefers-color-scheme:light){:root{--bg:#FAF9F5;--surface:#F3F1EA;--pill:#E9E6DC;--line:#E2DFD5;--strong:#1A1916;--text:#2D2C28;--muted:#737069;--accent:#2F5FD0;--code:#B4432B}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--text);font:15px/1.6 var(--sans)}
header{display:flex;align-items:center;gap:8px;padding:14px 24px;border-bottom:1px solid var(--line);color:var(--strong);font:500 17px var(--serif)}
main{flex:1;display:flex;flex-direction:column;justify-content:center;width:100%;max-width:420px;margin:0 auto;padding:48px 16px}
h1{margin:0 0 6px;color:var(--strong);font:500 30px/1.2 var(--serif)}
.lead{margin:0 0 28px;color:var(--muted)}
label{display:block;margin-bottom:6px;color:var(--strong);font-weight:500;font-size:14px}
input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--strong);font:500 22px var(--mono);letter-spacing:.12em;text-align:center;text-transform:uppercase}
input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
button{padding:10px 16px;border-radius:8px;border:1px solid var(--line);background:var(--pill);color:var(--strong);font:500 15px var(--sans);cursor:pointer}
button:hover{border-color:var(--muted)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#signin{width:100%;margin-top:16px;background:var(--strong);color:var(--bg);border-color:var(--strong)}
#approval{margin-top:24px;padding:20px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
#approval h2{margin:0 0 4px;color:var(--strong);font:500 19px/1.3 var(--serif)}
#client{margin:0 0 12px;color:var(--muted);font-size:14px}
#approval p strong{font-weight:500}
code{font-family:var(--mono);color:var(--code);font-size:.92em}
.actions{display:flex;gap:8px;margin-top:16px}
.actions button{flex:1}
#allow{background:var(--accent);color:#fff;border-color:var(--accent)}
@media (prefers-color-scheme:dark){#allow{color:#161615}}
#message{min-height:1.6em;margin:16px 0 0;color:var(--muted);text-align:center}
</style>
<header><svg viewBox="0 0 24 24" width="22" height="22" fill="none" aria-hidden="true"><path d="M6.5 18.5a4 4 0 0 1-.6-7.96 5.5 5.5 0 0 1 10.6-1.3A4.5 4.5 0 0 1 17.5 18.5h-11Z" fill="#5b8cff"/></svg>PMS Cloud</header>
<main><h1>Sign in to pms</h1><p class="lead">Check that the code is the same as the code in your terminal.</p>
<label for="code">Device code</label><input id="code" autocomplete="one-time-code" maxlength="9" spellcheck="false"><button id="signin">Sign in with GitHub</button>
<section id="approval" hidden><h2 id="prompt"></h2><p id="client"></p><p><strong>Only allow this if you ran <code>pms login</code> yourself.</strong></p><div class="actions"><button id="deny">Deny</button><button id="allow">Allow</button></div></section><p id="message" role="status"></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"></script><script>
const supabaseUrl='__SUPABASE_URL__'; const anonKey='__SUPABASE_ANON_KEY__';
const client=window.supabase.createClient(supabaseUrl,anonKey,{auth:{flowType:'pkce',detectSessionInUrl:true}});
const code=document.querySelector('#code'), panel=document.querySelector('#approval'), message=document.querySelector('#message');
code.value=decodeURIComponent(location.pathname.slice(1)).toUpperCase();
function normalized(){return code.value.toUpperCase().replace(/[^BCDFGHJKLMNPQRSTVWXZ]/g,'').replace(/^(.{4})(.*)$/,'$1-$2')}
async function check(){if(!code.value)return;let r=await fetch('/device/info',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({user_code:normalized()})});if(r.ok){let x=await r.json();document.querySelector('#prompt').textContent=`Allow pms on this device? Code ${x.user_code}`;document.querySelector('#client').textContent=`Client: ${x.client_info||'pms CLI'}`;panel.hidden=false}}
document.querySelector('#signin').onclick=async()=>{await check();const {error}=await client.auth.signInWithOAuth({provider:'github',options:{redirectTo:location.href}});if(error)message.textContent=error.message};
async function decide(path){const {data}=await client.auth.getSession();if(!data.session){message.textContent='Sign in first.';return}const r=await fetch(path,{method:'POST',headers:{'content-type':'application/json','authorization':`Bearer ${data.session.access_token}`},body:JSON.stringify({user_code:normalized()})});message.textContent=r.ok?'Done. You can return to the terminal.':'This code is invalid, expired, or already used.';panel.hidden=true}
document.querySelector('#allow').onclick=()=>decide('/device/approve');document.querySelector('#deny').onclick=()=>decide('/device/deny');check();
</script></html>
