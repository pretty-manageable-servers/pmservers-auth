<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in to pms</title><main><h1>Sign in to pms</h1><label>Device code <input id="code" autocomplete="one-time-code" maxlength="9"></label><button id="signin">Sign in with GitHub</button><section id="approval" hidden><h2 id="prompt"></h2><p id="client"></p><p><strong>Only allow this if you ran <code>pms login</code> yourself.</strong></p><button id="allow">Allow</button><button id="deny">Deny</button></section><p id="message" role="status"></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"></script><script>
const supabaseUrl='__SUPABASE_URL__'; const anonKey='__SUPABASE_ANON_KEY__';
const client=window.supabase.createClient(supabaseUrl,anonKey,{auth:{flowType:'pkce',detectSessionInUrl:true}});
const code=document.querySelector('#code'), panel=document.querySelector('#approval'), message=document.querySelector('#message');
code.value=decodeURIComponent(location.pathname.slice(1)).toUpperCase();
function normalized(){return code.value.toUpperCase().replace(/[^BCDFGHJKLMNPQRSTVWXZ]/g,'').replace(/^(.{4})(.*)$/,'$1-$2')}
async function check(){if(!code.value)return;let r=await fetch('/device/info',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({user_code:normalized()})});if(r.ok){let x=await r.json();document.querySelector('#prompt').textContent=`Allow pms on this device? Code ${x.user_code}`;document.querySelector('#client').textContent=`Client: ${x.client_info||'pms CLI'}`;panel.hidden=false}}
document.querySelector('#signin').onclick=async()=>{await check();const {error}=await client.auth.signInWithOAuth({provider:'github',options:{redirectTo:location.href}});if(error)message.textContent=error.message};
async function decide(path){const {data}=await client.auth.getSession();if(!data.session){message.textContent='Sign in first.';return}const r=await fetch(path,{method:'POST',headers:{'content-type':'application/json','authorization':`Bearer ${data.session.access_token}`},body:JSON.stringify({user_code:normalized()})});message.textContent=r.ok?'Done. You can return to the terminal.':'This code is invalid, expired, or already used.';panel.hidden=true}
document.querySelector('#allow').onclick=()=>decide('/device/approve');document.querySelector('#deny').onclick=()=>decide('/device/deny');check();
</script></html>
